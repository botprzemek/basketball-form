services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    container_name: basketball-devcontainer
    networks:
      basketball:
        aliases:
          - form
    environment:
      NUXT_APP_BASE_URL: "/"
      NUXT_DATABASE_URL: "postgres://root@basketball-database:26257/basketball?sslmode=disable"
      NUXT_TOKEN: "your-secret-token"
    volumes:
      - .:/workspace/basketball-form:cached
    tty: true
    stdin_open: true
    command: /bin/bash
  
  init-database:
    image: cockroachdb/cockroach:latest-v23.2
    networks:
      basketball:
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../database.sql:/cockroach/init.sql
    entrypoint: >
      /bin/sh -c "
        ./cockroach init --host=basketball-database:26257 --insecure
        ./cockroach sql --insecure --host=db:26257 < /cockroach/init.sql
      "
    depends_on:
      - database

  form:
      profiles: ["donotstart"]